<!doctype html>
<html lang="en">

<head>
    <meta charset="utf-8">
    <title>TypeShift</title>
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <link href="style.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.0.2/dist/css/bootstrap.min.css" rel="stylesheet"
        integrity="sha384-EVSTQN3/azprG1Anm3QDgpJLIm9Nao0Yz1ztcQTwFspd3yD65VohhpuuCOmLASjC" crossorigin="anonymous">
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
        integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY=" crossorigin="" />

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"
        integrity="sha256-20nQCchB9co0qIjJZRGuk2/Z9VM+kNiyxNV1lvTlZBo=" crossorigin=""></script>

    <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script src="load-comps.js"></script>
    <style>
        .blogs-section {
            height: 400px;
            background-color: antiquewhite;
        }

        .blog-container {
            background-color: aqua;
            width: 90%;
            height: 90%;
            margin: 1rem;
        }

        #author {
            width: 100%;
        }

        #title {
            width: 100%;
        }

        #body {
            width: 100%;
        }

        #submit-blog {
            width: 100%;
        }

        #blog-list-main {
            display: block;
        }
        #blog-show {
            display: none;
        }
    </style>
</head>

<body>
    <span id="navbar"></span>
    <main class="container py-5">
        <h1 id="welcome-h1">Welcome to TypeShift</h1>
        <p id="welcome-p" class="lead">Men lie, women lie, we all lie, just don't make it a habbit.</p>
        <hr>
        <section id="blog-list-main" style="height: 200px;">
            <div class="row">
                <div class="col-8">
                    <div class="blogs-list">
                        <h3>Posts</h3>
                        <ul id="ul-blogs" style="list-style-type: none;">

                        </ul>
                    </div>
                </div>
                <div class="col-4" style="border-left: 1px solid;">
                    <form action="/api/blogs" method="post">
                        <label for="author">Author:</label><br>
                        <input type="text" id="author" name="author" required><br>

                        <label for="title">Title:</label><br>
                        <input type="text" id="title" name="title" required><br>

                        <!-- 2. Добавлен текст в label -->
                        <label for="body">Blog:</label><br>
                        <textarea id="body" name="body" rows="4" required></textarea><br><br>

                        <input id="submit-blog" type="submit" value="Опубликовать">
                    </form>
                </div>
            </div>
        </section>
        <section id="blog-show">
            <h3 id="title">?</h1>
            <p id="body">
                ?
            </p>
            <span id="author" style="color: gray;">?</span>
        </section>
    </main>
    <script>
        async function loadBlog(id) {
            try {
                const res = await fetch(`/api/blogs/${id}`);
                if (!res.ok) throw new Error('Network response was not ok');
                const data = await res.json();
                
                const blogShow = document.getElementById("blog-show");
                blogShow.innerHTML = `<h3 id="title">${data.title}</h1>
                    <p id="body">${data.body}</p>
                    <span id="author" style="color: gray;">${data.author}</span>`;
            } catch (err) {
                console.log(err);
            }
        }

        async function loadBlogs() {
            try {
                const res = await fetch('/api/blogs');
                if (!res.ok) throw new Error('Network response was not ok');
                const data = await res.json();

                const list = document.getElementById('ul-blogs');
                data.forEach(itemText => {
                    const li = document.createElement("li");

                    li.innerHTML = `<a href="?id=${itemText._id}">${itemText.title}</a>`;

                    list.appendChild(li);
                });
            } catch (err) {
                console.log(err);
            }
        }

        window.addEventListener('DOMContentLoaded', () => {
            const urlParams = new URLSearchParams(window.location.search);
            const blogId = urlParams.get('id');

            const blogShow = document.getElementById("blog-show");
            const blogListShow = document.getElementById("blog-list-main");

            if (blogId) {
                blogShow.style.display = "block";
                blogListShow.style.display = "none";
                loadBlog(blogId);
            } else {
                loadBlogs();
            }
        });
    </script>
</body>

</html>
