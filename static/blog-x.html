<!doctype html>
<html lang="en">

<head>
    <meta charset="utf-8">
    <title>TypeShift</title>
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <link href="style.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.0.2/dist/css/bootstrap.min.css" rel="stylesheet"
        integrity="sha384-EVSTQN3/azprG1Anm3QDgpJLIm9Nao0Yz1ztcQTwFspd3yD65VohhpuuCOmLASjC" crossorigin="anonymous">
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
        integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY=" crossorigin="" />

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"
        integrity="sha256-20nQCchB9co0qIjJZRGuk2/Z9VM+kNiyxNV1lvTlZBo=" crossorigin=""></script>

    <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script src="/static/load-comps.js"></script>
    <style>
        .blogs-section {
            height: 400px;
            background-color: antiquewhite;
        }

        .blog-container {
            background-color: aqua;
            width: 90%;
            height: 90%;
            margin: 1rem;
        }

        #author {
            width: 100%;
        }

        #title {
            width: 100%;
        }

        #body {
            width: 100%;
        }

        #submit-blog {
            width: 100%;
        }
    </style>
</head>

<body>
    <span id="navbar"></span>
    <main class="container py-5">
        <h1 id="welcome-h1">Welcome to TypeShift</h1>
        <p id="welcome-p" class="lead">Men lie, women lie, we all lie, just don't make it a habbit.</p>
        <hr>
        <section>
            <h3 id="title">?</h1>
            <p id="body">
                ?
            </p>
            <span id="author" style="color: gray;">?</span>
        </section>
    </main>
    <script>
        async function loadBlog() {
            try {
                const pathParts = window.location.pathname.split('/'); 
                const id = pathParts[pathParts.length - 1]; 
                
                const res = await fetch(`/api/blogs/${id}`);
                if (!res.ok) throw new Error('Network response was not ok');
                const data = await res.json();

                const title = document.getElementById("title");
                const body = document.getElementById("body");
                const author = document.getElementById("author");

                title.innerHTML = data.title;
                body.innerHTML = data.body;
                author.innerHTML = data.author;
            } catch (err) {
                console.log(err);
            }
        }

        document.addEventListener('DOMContentLoaded', () => {
            loadBlog();
        });
    </script>
</body>

</html>
