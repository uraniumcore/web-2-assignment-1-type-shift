<!doctype html>
<html lang="en">

<head>
    <meta charset="utf-8">
    <title>TypeShift - Authentication</title>
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <link href="style.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.0.2/dist/css/bootstrap.min.css" rel="stylesheet"
        integrity="sha384-EVSTQN3/azprG1Anm3QDgpJLIm9Nao0Yz1ztcQTwFspd3yD65VohhpuuCOmLASjC" crossorigin="anonymous">
    <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script src="load-comps.js"></script>
</head>

<body>
    <span id="navbar"></span>
    <main class="container py-5">
        <h1>Authentication</h1>
        <p class="lead">Login or create a new account</p>
        <hr>

        <!-- Alert Messages -->
        <div id="alert-container"></div>

        <!-- Auth Section (Login/Register) -->
        <section id="auth-section">
            <div class="row justify-content-center">
                <div class="col-md-6">
                    <!-- Login Form -->
                    <div class="card" id="login-card">
                        <div class="card-body">
                            <h5 class="card-title">Login</h5>
                            <form id="login-form">
                                <div class="mb-3">
                                    <label for="login-username" class="form-label">Username</label>
                                    <input type="text" class="form-control" id="login-username" required>
                                </div>
                                <div class="mb-3">
                                    <label for="login-password" class="form-label">Password</label>
                                    <input type="password" class="form-control" id="login-password" required>
                                </div>
                                <button type="submit" class="btn btn-primary w-100">Login</button>
                            </form>
                            <hr>
                            <p class="text-center mb-0">
                                Don't have an account?
                                <button type="button" class="btn btn-link" onclick="toggleForm()">Register here</button>
                            </p>
                        </div>
                    </div>

                    <!-- Register Form -->
                    <div class="card" id="register-card" style="display: none;">
                        <div class="card-body">
                            <h5 class="card-title">Register</h5>
                            <form id="register-form">
                                <div class="mb-3">
                                    <label for="register-name" class="form-label">Full Name</label>
                                    <input type="text" class="form-control" id="register-name" required>
                                </div>
                                <div class="mb-3">
                                    <label for="register-username" class="form-label">Username</label>
                                    <input type="text" class="form-control" id="register-username" required>
                                </div>
                                <div class="mb-3">
                                    <label for="register-email" class="form-label">Email</label>
                                    <input type="email" class="form-control" id="register-email" required>
                                </div>
                                <div class="mb-3">
                                    <label for="register-password" class="form-label">Password</label>
                                    <input type="password" class="form-control" id="register-password" required>
                                </div>
                                <button type="submit" class="btn btn-primary w-100">Register</button>
                            </form>
                            <hr>
                            <p class="text-center mb-0">
                                Already have an account?
                                <button type="button" class="btn btn-link" onclick="toggleForm()">Login here</button>
                            </p>
                        </div>
                    </div>
                </div>
            </div>
        </section>

        <!-- Profile Section (hidden by default) -->
        <section id="profile-section" style="display: none;">
            <div class="card">
                <div class="card-body">
                    <h5 class="card-title">Profile</h5>
                    <hr>
                    <p><strong>Name:</strong> <span id="profile-name"></span></p>
                    <p><strong>Username:</strong> <span id="profile-username"></span></p>
                    <p><strong>Email:</strong> <span id="profile-email"></span></p>
                    <p><strong>Member since:</strong> <span id="profile-date"></span></p>
                    <button id="logout-btn" class="btn btn-danger">Logout</button>
                </div>
            </div>
        </section>
    </main>

    <script>
        const API_BASE = '/api/auth';

        function toggleForm() {
            const loginCard = document.getElementById('login-card');
            const registerCard = document.getElementById('register-card');

            if (loginCard.style.display === 'none') {
                loginCard.style.display = 'block';
                registerCard.style.display = 'none';
            } else {
                loginCard.style.display = 'none';
                registerCard.style.display = 'block';
            }
        }

        function showAlert(message, type) {
            const alertContainer = document.getElementById('alert-container');
            alertContainer.innerHTML = `
                <div class="alert alert-${type} alert-dismissible fade show" role="alert">
                    ${message}
                    <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
                </div>
            `;
        }

        async function checkAuth() {
            const token = localStorage.getItem('token');
            if (token) {
                try {
                    const res = await fetch(`${API_BASE}/profile`, {
                        headers: { 'Authorization': `Bearer ${token}` }
                    });
                    if (res.ok) {
                        const data = await res.json();
                        showProfile(data);
                    } else {
                        localStorage.removeItem('token');
                    }
                } catch (err) {
                    console.error(err);
                    localStorage.removeItem('token');
                }
            }
        }

        function showProfile(data) {
            document.getElementById('auth-section').style.display = 'none';
            document.getElementById('profile-section').style.display = 'block';
            document.getElementById('profile-name').textContent = data.name;
            document.getElementById('profile-username').textContent = data.username;
            document.getElementById('profile-email').textContent = data.email;
            document.getElementById('profile-date').textContent = new Date(data.createdAt).toLocaleDateString();
        }

        function showAuth() {
            document.getElementById('auth-section').style.display = 'block';
            document.getElementById('profile-section').style.display = 'none';
        }

        document.getElementById('login-form').addEventListener('submit', async (e) => {
            e.preventDefault();
            const username = document.getElementById('login-username').value;
            const password = document.getElementById('login-password').value;

            try {
                const res = await fetch(`${API_BASE}/login`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ username, password })
                });
                const data = await res.json();

                if (res.ok) {
                    localStorage.setItem('token', data.token);
                    showAlert(data.msg, 'success');
                    setTimeout(() => checkAuth(), 1000);
                } else {
                    showAlert(data.error, 'danger');
                }
            } catch (err) {
                showAlert('Network error', 'danger');
            }
        });

        document.getElementById('register-form').addEventListener('submit', async (e) => {
            e.preventDefault();
            const name = document.getElementById('register-name').value;
            const username = document.getElementById('register-username').value;
            const email = document.getElementById('register-email').value;
            const password = document.getElementById('register-password').value;

            try {
                const res = await fetch(`${API_BASE}/register`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ name, username, email, password })
                });
                const data = await res.json();

                if (res.ok) {
                    showAlert(data.msg + ' Please login.', 'success');
                    document.getElementById('register-form').reset();
                } else {
                    showAlert(data.error, 'danger');
                }
            } catch (err) {
                showAlert('Network error', 'danger');
            }
        });

        document.getElementById('logout-btn').addEventListener('click', async () => {
            const token = localStorage.getItem('token');
            try {
                await fetch(`${API_BASE}/logout`, {
                    method: 'POST',
                    headers: { 'Authorization': `Bearer ${token}` }
                });
            } catch (err) {
                console.error(err);
            }
            localStorage.removeItem('token');
            showAuth();
            showAlert('Logged out successfully', 'info');
        });

        document.addEventListener('DOMContentLoaded', () => {
            checkAuth();
        });
    </script>
</body>

</html>
