<!doctype html>
<html lang="en">

<head>
    <meta charset="utf-8">
    <title>TypeShift</title>
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <link href="style.css" rel="stylesheet"> 
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.0.2/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-EVSTQN3/azprG1Anm3QDgpJLIm9Nao0Yz1ztcQTwFspd3yD65VohhpuuCOmLASjC" crossorigin="anonymous">

    <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script src="load-comps.js"></script>
</head>

<body class="bg-light">
    <span id="navbar"></span>
    <div class="container min-vh-100 d-flex justify-content-center align-items-center">
        <div class="card shadow-sm border-0" style="max-width: 420px; width: 100%;">
            <div class="card-body p-4">
                <h5 class="card-title text-center mb-4">Body Mass Index calculator by Me &#10084;&#65039;</h5>

                <form>
                    <div class="mb-3">
                        <label for="inputHeight" class="form-label">Height</label>
                        <input type="number" class="form-control" id="inputHeight" placeholder="Enter your height">
                    </div>

                    <div class="mb-3">
                        <label for="inputWeight" class="form-label">Weight</label>
                        <input type="number" class="form-control" id="inputWeight" placeholder="Enter your weight">
                    </div>

                    <button type="button" class="btn btn-primary w-100" id="send">
                        What's my BMI
                    </button>
                </form>
            </div>
            <div class="mt-4 p-3 border rounded bg-white">
                Result: <span class="result" id="result">?</span><br>
                You are: <span class="category" id="category">?</span>
            </div>
        </div>
    </div>

    <script>
        const send = document.getElementById("send");
        send.addEventListener('click', function () {
            const weight = document.getElementById("inputWeight");
            const height = document.getElementById("inputHeight");
            console.log(weight.value, height.value);
            
            if (weight.value <= 30 || height.value <= 30 || height.value > 250 || weight.value > 300) {
                alert("Why you lie?");
                return;
            }

            async function postData(url, data) {
                const params = new URLSearchParams({
                    weight: data.weight,
                    height: data.height
                });

                const fullUrl = `${url}?${params.toString()}`;

                try {
                    const response = await fetch(fullUrl, {
                        method: 'POST'
                    });

                    if (!response.ok) {
                        throw new Error(`HTTP error! status: ${response.status}`);
                    }

                    const responseData = await response.json();

                    if (responseData.bmi === undefined) {
                        alert("Write your actual height and weight.");
                        return;
                    }

                    const result = document.getElementById("result");
                    result.classList.add('after');
                    result.innerHTML = responseData.bmi;

                    const category = document.getElementById("category");
                    category.classList.add('after');
                    category.innerHTML = responseData.category;

                    const colors = {
                        "Underweight": "gray",
                        "Normal weight": "green",
                        "Overweight": "orange",
                        "Obese": "red"
                    };

                    result.style.color = colors[responseData.category];
                    category.style.color = colors[responseData.category];

                } catch (error) {
                    console.error("Request failed:", error);
                }
            }

            const myData = {
                weight: weight.value,
                height: height.value
            };

            postData("http://localhost:3000/api/calc", myData);

            console.log(myData);
        });
    </script>
</body>

</html>
