<!doctype html>
<html lang="en">

<head>
    <meta charset="utf-8">
    <title>Simple Bootstrap Form</title>
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <link href="style.css" rel="stylesheet"> 
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.0.2/dist/css/bootstrap.min.css" rel="stylesheet"
        integrity="sha384-EVSTQN3/azprG1Anm3QDgpJLIm9Nao0Yz1ztcQTwFspd3yD65VohhpuuCOmLASjC" crossorigin="anonymous">
</head>

<body class="bg-light">

    <div class="container min-vh-100 d-flex justify-content-center align-items-center">
        <div class="card shadow-sm border-0" style="max-width: 420px; width: 100%;">
            <div class="card-body p-4">
                <h5 class="card-title text-center mb-4">Body Mass Index calculator by Me &#10084;&#65039;</h5>

                <form>
                    <div class="mb-3">
                        <label for="inputHeight" class="form-label">Height</label>
                        <input type="number" class="form-control" id="inputHeight" placeholder="Enter your height">
                    </div>

                    <div class="mb-3">
                        <label for="inputWeight" class="form-label">Weight</label>
                        <input type="number" class="form-control" id="inputWeight" placeholder="Enter your weight">
                    </div>

                    <button type="button" class="btn btn-primary w-100" id="send">
                        What's my BMI
                    </button>
                </form>
            </div>
            <div class="mt-4 p-3 border rounded bg-white">
                Result: <span class="result" id="result">?</span>
            </div>
        </div>
    </div>

    <script>
        const send = document.getElementById("send");
        send.addEventListener('click', function () {
            const weight = document.getElementById("inputWeight");
            const height = document.getElementById("inputHeight");
            console.log(weight.value, height.value);
            
            if (weight.value <= 30 || height.value <= 30 || height.value > 250 || weight.value > 300) {
                alert("Why you lie?");
                return;
            }

            async function postData(url, data) {
                try {
                    const response = await fetch(url, {
                        method: 'POST',
                        headers: {
                            'Content-Type': 'application/json'
                        },
                        body: JSON.stringify(data)
                    });

                    if (!response.ok) {
                        throw new Error(`HTTP error! status: ${response.status}`);
                    }

                    const text = await response.text();
                    console.log("Raw server response:", text);

                    const responseData = JSON.parse(text);
                    console.log("Parsed JSON:", responseData);

                    const messs = document.getElementById("result");
                    if (responseData.bmi == undefined){
                        alert("Write your actual height and weight.");
                        return;
                    }

                    if (responseData.bmi < 18.5) {
                        messs.innerHTML = "Underweight";
                        messs.style.color = "gray";
                    }
                    else if (responseData.bmi < 25) {
                        messs.innerHTML = "Normal weight";
                        messs.style.color = "green";
                    }
                    else if (responseData.bmi < 30) {
                        messs.innerHTML = "Overweight";
                        messs.style.color = "orange";
                    }
                    else if (responseData.bmi >= 30) {
                        messs.innerHTML = "Obese";
                        messs.style.color = "red";
                    }

                    messs.classList.add('after');

                    const result = document.getElementById("result");
                    result.innerHTML = responseData.bmi;

                } catch (error) {
                    console.error("Error:", error);
                }
            }

            const myData = {
                weight: weight.value,
                height: height.value
            };

            postData("http://localhost:3000/send", myData);

            console.log(myData);
        });
    </script>
</body>

</html>
